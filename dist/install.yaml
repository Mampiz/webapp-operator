  name: webapp-operator-selfsigned-issuer
  namespace: webapp-operator-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: webapp-operator-system/webapp-operator-serving-cert
  name: webapp-operator-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webapp-operator-webhook-service
      namespace: webapp-operator-system
      path: /mutate-platform-miportfolio-com-v1-webapp
  failurePolicy: Fail
  name: mwebapp-v1.kb.io
  rules:
  - apiGroups:
    - platform.miportfolio.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - webapps
  sideEffects: None
