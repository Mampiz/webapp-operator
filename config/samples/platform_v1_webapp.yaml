apiVersion: platform.miportfolio.com/v1
kind: WebApp
metadata:
  labels:
    app.kubernetes.io/name: webapp-operator
    app.kubernetes.io/managed-by: kustomize
  name: webapp-sample
spec:
  image: nginx:latest
  replicas: 2
  port: 80
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    cpuThresholdPercent: 70
