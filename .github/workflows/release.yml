name: Release image

# Publishes the operator image to GitHub Container Registry (ghcr.io) whenever a
# version tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`), or
# manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No "latest" tag on purpose: this operator rejects mutable tags for the
          # workloads it manages, so it does not publish one for itself either.
          # Consumers pin a version; dist/install.yaml and the Helm chart do too.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The install manifests are what the README tells people to apply, so they have
  # to exist as release assets and reference the image published above.
  publish-manifests:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve the released image
        id: image
        run: |
          # Container references must be lowercase, and github.repository keeps
          # the owner's original casing ("Mampiz"). docker/metadata-action
          # lowercases for the build, but this reference is built by hand and
          # would otherwise be baked into the install manifests as unpullable.
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build install manifests
        run: make build-installer IMG=${{ steps.image.outputs.ref }}

      - name: Verify the manifests reference a pullable image
        run: |
          # A manifest that cannot pull its image is worse than no manifest: the
          # failure surfaces as ImagePullBackOff on someone else's cluster.
          ref="$(grep -oE 'image: [^ ]+' dist/install.yaml | tail -1 | cut -d' ' -f2)"
          echo "install.yaml references: ${ref}"
          if [ "${ref}" != "$(echo "${ref}" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::image reference is not lowercase: ${ref}" && exit 1
          fi
          case "${ref}" in
            "${{ steps.image.outputs.ref }}") ;;
            *) echo "::error::expected ${{ steps.image.outputs.ref }}" && exit 1 ;;
          esac

      - name: Package the Helm chart
        run: |
          helm package dist/chart --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME#v}" --destination dist/

      - name: Create or update the release with its assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Published, not a draft: a draft release keeps its assets on an
          # "untagged-..." URL, so the documented
          # releases/download/<tag>/install.yaml link 404s and the primary
          # install path is broken for everyone but the repository owner.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/install.yaml
            dist/install-with-webhooks.yaml
            dist/*.tgz

  # Publishing the chart as an OCI artifact means `helm install` does not require
  # cloning the repository.
  publish-chart:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push the chart
        run: |
          # OCI repository names must be lowercase; the owner login may not be.
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm package dist/chart --version "$VERSION" --app-version "$VERSION" --destination dist/
          helm push "dist/webapp-operator-${VERSION}.tgz" \
            "oci://${{ env.REGISTRY }}/${OWNER}/charts"
